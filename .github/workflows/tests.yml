name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Promote SONAR_TOKEN to job env so the SonarCloud step can gate on
    # `env.SONAR_TOKEN != ''` — `secrets.*` isn't allowed in `if:`. This
    # makes the step a no-op on fork PRs (where the secret isn't injected)
    # and on any repo that hasn't configured the token yet.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Sonar needs full git history for accurate "new code" blame attribution.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      # No browser is installed in this job on purpose (build plan task
      # t14, spec claim c32 / honesty h29): every browser-touching test is
      # gated behind WEBGLASS_TEST_BROWSER=1 (see
      # tests/test_playwright_adapter.py's module docstring) and skips
      # cleanly without it, so this job characterizes "a browserless run
      # still passes the non-browser suite". The live-Chromium tier runs
      # separately in the browser-test job below.
      - run: uv run pytest -n auto --cov=webglass --cov-report=xml:coverage.xml --cov-report=term -v

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  # Live-Chromium integration tier for the M2 Playwright adapter (build plan
  # task t14, spec claim c32 / honesty h29). Deliberately separate from
  # `test` above: `test` runs with no browser installed at all and every
  # browser-touching test skips cleanly there (WEBGLASS_TEST_BROWSER unset);
  # this is the only job that sets that variable and provisions a pinned,
  # cached Chromium to back it.
  browser-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      - name: Resolve the pinned playwright version (cache key)
        id: playwright
        run: |
          VERSION=$(uv run python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - run: uv run playwright install --with-deps chromium

      - name: Allow unprivileged user namespaces (risk r4)
        run: |
          # ubuntu-24.04 GitHub-hosted runners restrict unprivileged user
          # namespace creation via AppArmor
          # (kernel.apparmor_restrict_unprivileged_userns=1), which makes a
          # default *sandboxed* Chromium launch abort with "No usable
          # sandbox!" — reproduced locally; see
          # webglass/adapters/playwright.py's SANDBOX_REMEDIATION and risk
          # r4 in docs/plans/2026-08-07-implement-webglass-issue-1.md
          # ("t14 must verify the provisioning path yields a usable sandbox
          # on GitHub Actions runners"). GitHub-hosted runners permit
          # passwordless sudo, so this job restores a genuinely usable
          # sandbox for Chromium rather than ever passing --no-sandbox,
          # which the adapter refuses to do as an automatic fallback.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests with the browser tier enabled
        run: WEBGLASS_TEST_BROWSER=1 uv run pytest -n auto -v

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      - name: black --check
        run: uv run black --check webglass tests

      - name: isort --check
        run: uv run isort --check-only webglass tests

      - name: flake8
        run: uv run flake8 webglass tests

      - name: bandit
        run: uv run bandit -c pyproject.toml -r webglass

      - name: markdownlint-cli2
        run: |
          npm install -g markdownlint-cli2@0.21.0
          markdownlint-cli2 "**/*.md" "#node_modules" "#.local" "#.claude/skills" "#.teken" "#.venv"

      - name: afi rubric gate
        run: uv run teken cli doctor . --strict

  version-check:
    # Only run on PR events. On push to main after a merged PR, the comparison
    # would always fail (PR_VERSION == MAIN_VERSION because HEAD and origin/main
    # point at the same commit). Restricting the trigger avoids that.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - run: git fetch origin main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check version bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # AgentCulture rule: every PR bumps the version — even docs/config/CI.
          # See CLAUDE.md and the version-bump skill for rationale.
          PR_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          MAIN_VERSION=$(git show origin/main:pyproject.toml 2>/dev/null | python3 -c "import sys,tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])" 2>/dev/null || echo "")

          if [ -z "$MAIN_VERSION" ]; then
            echo "No pyproject.toml on main yet — skipping version check (initial scaffold)."
            exit 0
          fi

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            MARKER="<!-- version-check -->"
            BODY="⚠️ **Version not bumped** — \`pyproject.toml\` still has \`$PR_VERSION\` (same as main). Bump before merging to avoid a failed PyPI publish.

          $MARKER"

            EXISTING=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              --jq '.[] | select(.body | contains("<!-- version-check -->")) | .id' | head -1)

            if [ -n "$EXISTING" ]; then
              gh api repos/${{ github.repository }}/issues/comments/$EXISTING \
                -X PATCH -f body="$BODY" > /dev/null
            else
              gh pr comment ${{ github.event.pull_request.number }} --body "$BODY" || true
            fi

            echo "::error::Version $PR_VERSION matches main. Bump before merging."
            exit 1
          else
            echo "Version bumped: $MAIN_VERSION -> $PR_VERSION"
          fi
